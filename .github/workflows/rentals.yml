# Aidi Haven rentals: Airbnb calendars every two hours (listings, recurring expenses, rent and payout matching once a
# day inside the same job). Needs the repository secret CRON_SECRET.
name: Rentals sync
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync calendars and listings
        run: |
          curl -fsS -X POST https://app.theaidigroup.com/api/public/cron/rentals -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" -H "content-type: application/json" -d '{}'
