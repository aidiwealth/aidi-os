# Meeting reminders every 15 minutes. Needs the repository secret CRON_SECRET (same value as NUXT_CRON_SECRET).
name: Meeting reminders
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send meeting reminders
        run: |
          curl -fsS -X POST https://app.theaidigroup.com/api/public/cron/meetings \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" -H "content-type: application/json" -d '{}'
      - name: Record status checks
        run: |
          curl -fsS -X POST https://app.theaidigroup.com/api/public/cron/status \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" -H "content-type: application/json" -d '{}'
      - name: Renew storage packs
        run: |
          curl -fsS -X POST https://app.theaidigroup.com/api/public/cron/storage \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" -H "content-type: application/json" -d '{}'
      - name: Wealth subscriptions (monthly)
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "08" ] && [ "$(date -u +%M)" -lt "15" ]; then
            curl -fsS -X POST https://app.theaidigroup.com/api/public/cron/wm-billing -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" -H "content-type: application/json" -d '{}'
          fi
