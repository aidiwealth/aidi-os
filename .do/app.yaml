# Aidi OS on DigitalOcean App Platform — separate project from the websites and Aidi Wealth.
# Create: doctl apps create --spec .do/app.yaml   Update: doctl apps update <APP_ID> --spec .do/app.yaml
name: aidi-os
region: nyc
domains:
  - domain: app.theaidigroup.com
    type: PRIMARY
services:
  - name: web
    github:
      repo: aidiwealth/aidi-os
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: node .output/server/index.mjs
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /api/ping
    envs:
      - { key: NODE_ENV, value: production }
      - { key: PORT, value: "8080" }
